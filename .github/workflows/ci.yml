name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: macOS verification
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan committed history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_VERSION: "8.30.1"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Check formatting
        run: corepack pnpm format:check

      - name: Lint
        run: corepack pnpm lint

      - name: Type-check
        run: corepack pnpm typecheck

      - name: Build
        run: corepack pnpm build

      - name: Test
        run: corepack pnpm test

      - name: Replay the locked bridge offline
        run: ./scripts/vendor-bridge --offline-replay

      - name: Check operator scripts
        run: /bin/zsh -n scripts/install scripts/doctor scripts/restart

      - name: Verify the installer contract
        env:
          ASSISTANT_TEST_MODE: "1"
        run: |
          ./scripts/install --verify-only
          ./scripts/install --plan >/dev/null

      - name: Reject generated tracked changes
        run: |
          git diff --check
          git diff --exit-code
